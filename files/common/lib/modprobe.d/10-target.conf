#
# Enable the pr_debug() statements that report LUN resets and iSCSI
# reconnects, so the kernel log carries them when support needs them.
#
# The kernel applies dyndbg= as it loads the module, whoever loads it, so
# setting the flags here means nothing has to load these modules early just
# to switch them on. It also works under Secure Boot, which denies writes to
# /sys/kernel/debug/dynamic_debug/control.
#
options target_core_mod dyndbg="file target_core_tmr.c +p"
options iscsi_target_mod dyndbg="func iscsit_handle_dataout_timeout +p"
